name: Post diário no blog de IA

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 10:00 de Brasília (manhã)
    - cron: "0 0 * * *"    # 00:00 UTC = 21:00 de Brasília (noite)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publicar 1 artigo de IA
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IMG_BASE: ${{ secrets.IMG_BASE }}
        run: node scripts/daily-post.js

      - name: Registrar a execução (mantém o repositório ativo; sem commit por 60 dias o GitHub desliga o agendamento)
        if: always()
        run: |
          mkdir -p estado
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') ${{ job.status }}" > estado/ultima-execucao.txt
          git config user.name "robo-blog"
          git config user.email "robo-blog@users.noreply.github.com"
          git add estado/ultima-execucao.txt
          git diff --staged --quiet && exit 0
          git commit -q -m "robô: execução $(date -u +'%d/%m %H:%M UTC') [skip ci]"
          git pull -q --rebase --autostash origin main
          git push -q
